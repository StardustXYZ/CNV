# CNV sul telefono: ogni notte aggiorna i dati e pubblica il sito su GitHub Pages.
#
# 1. recupera il database dal ramo "dati" (se esiste già)
# 2. fa il sync: siti dei cinema, prossimamente, TMDB, stati dei film
# 3. salva il database nel ramo "dati" (un solo commit, sovrascritto ogni volta)
# 4. costruisce il sito (phone/ + data.json) e lo pubblica su GitHub Pages
#
# Serve: repository pubblico, segreto TMDB_API_KEY, Settings -> Pages -> Source: GitHub Actions.
name: Aggiorna CNV per il telefono

on:
  schedule:
    # GitHub fa partire gli orari programmati anche con ore di ritardo (a novembre 2026
    # il giro delle 05:15 UTC partiva tra le 11:45 e le 13:10): due giri di notte, così
    # i dati sono pronti al mattino e se uno fallisce c'è l'altro. Ore UTC.
    - cron: "17 1 * * *"   # 02:17 in Italia (03:17 con l'ora legale)
    - cron: "47 3 * * *"   # 04:47 in Italia (05:47 con l'ora legale)
  workflow_dispatch:         # e a mano: Actions -> Aggiorna CNV per il telefono -> Run workflow

permissions:
  contents: write   # salvare il database nel ramo "dati"
  pages: write
  id-token: write
  actions: write    # tenere attivo l'aggiornamento automatico (ultimo passo)

concurrency:
  group: aggiorna-telefono
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    env:
      TZ: Europe/Rome                                   # "oggi" è il giorno italiano
      DATABASE_URL: sqlite:///${{ github.workspace }}/dati/cnv.db
      AUTO_SYNC: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Recupera il database
        run: |
          mkdir -p dati
          # 0 = il ramo esiste, 2 = non esiste ancora; altro = errore di rete o di GitHub.
          # Solo se il ramo manca davvero si parte da un database nuovo: altrimenti si
          # sovrascriverebbe quello vero e i voti del telefono finirebbero su altri film.
          found=0
          git ls-remote --exit-code --heads origin dati > /dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git fetch --quiet --depth=1 origin dati
            git show FETCH_HEAD:cnv.db > dati/cnv.db
            test -s dati/cnv.db
            echo "Database recuperato dal ramo dati"
          elif [ "$found" -eq 2 ]; then
            echo "Primo avvio: database nuovo"
          else
            echo "::error::Non riesco a controllare il ramo dati: aggiornamento annullato, il sito resta quello di ieri"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa CNV
        run: pip install -e .

      - name: Sync (cinema, prossimamente, TMDB)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m app.sync

      - name: Salva il database nel ramo dati
        run: |
          cp dati/cnv.db "$RUNNER_TEMP/cnv.db"
          cd "$RUNNER_TEMP"
          mkdir ramo-dati && mv cnv.db ramo-dati/ && cd ramo-dati
          git init --quiet --initial-branch=dati
          git add cnv.db
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Database CNV del $(date +%d/%m/%Y)"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dati

      - name: Costruisci il sito per il telefono
        run: python -m app.export_static --out site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Pubblica su GitHub Pages
        id: pubblica
        uses: actions/deploy-pages@v5

      # In un repository pubblico GitHub mette in pausa gli orari programmati dopo 60 giorni
      # senza attività. Riattivare il workflow a ogni giro azzera il conto: non serve
      # nessun commit e, se non riesce, l'aggiornamento di oggi è comunque fatto.
      - name: Tieni attivo l'aggiornamento automatico
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/aggiorna-telefono.yml/enable"
          echo "Aggiornamento automatico attivo"
