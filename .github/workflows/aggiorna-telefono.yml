# CNV sul telefono: ogni notte aggiorna i dati e pubblica il sito su GitHub Pages.
#
# 1. costruisce l'app Flutter per il browser (se non riesce, stanotte non cambia niente)
# 2. recupera il database dal ramo "dati" (se esiste già)
# 3. fa il sync: siti dei cinema, prossimamente, TMDB, stati dei film
# 4. salva il database nel ramo "dati" (un solo commit, sovrascritto ogni volta)
# 5. pubblica su GitHub Pages l'app per il browser con data.json, che legge anche l'app Android
# 6. manda le notifiche; solo se l'invio riesce segna i film come notificati e salva di nuovo il database
#
# Se nessun cinema si lascia leggere il sync fallisce e il sito resta quello di ieri.
#
# Serve: repository pubblico, segreto TMDB_API_KEY, Settings -> Pages -> Source: GitHub Actions.
# Notifiche dell'app Android (facoltative): segreto FIREBASE_SERVICE_ACCOUNT (la chiave JSON
# dell'account di servizio di Firebase).
name: Aggiorna CNV per il telefono

on:
  schedule:
    # GitHub fa partire gli orari programmati anche con ore di ritardo (a novembre 2026
    # il giro delle 05:15 UTC partiva tra le 11:45 e le 13:10): due giri di notte, così
    # i dati sono pronti al mattino e se uno fallisce c'è l'altro. Ore UTC.
    - cron: "17 1 * * *"   # 02:17 in Italia (03:17 con l'ora legale)
    - cron: "47 3 * * *"   # 04:47 in Italia (05:47 con l'ora legale)
  workflow_dispatch:         # e a mano: Actions -> Aggiorna CNV per il telefono -> Run workflow
    inputs:
      prova:
        description: "Manda una notifica di prova anche senza film nuovi"
        type: boolean
        default: false

permissions:
  contents: write   # salvare il database nel ramo "dati"
  pages: write
  id-token: write
  actions: write    # tenere attivo l'aggiornamento automatico (ultimo passo)

concurrency:
  group: aggiorna-telefono
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    env:
      TZ: Europe/Rome                                   # "oggi" è il giorno italiano
      DATABASE_URL: sqlite:///${{ github.workspace }}/dati/cnv.db
    steps:
      - uses: actions/checkout@v7

      # Prima di tutto: se l'app non si costruisce, il resto non parte e il sito resta quello di ieri
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Costruisci l'app per il browser (Flutter)
        working-directory: mobile
        run: flutter build web --release --base-href /CNV/ --pwa-strategy=none --no-wasm-dry-run

      - name: Recupera il database
        run: |
          mkdir -p dati
          # 0 = il ramo esiste, 2 = non esiste ancora; altro = errore di rete o di GitHub.
          # Solo se il ramo manca davvero si parte da un database nuovo: altrimenti si
          # sovrascriverebbe quello vero e i voti del telefono finirebbero su altri film.
          found=0
          git ls-remote --exit-code --heads origin dati > /dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git fetch --quiet --depth=1 origin dati
            git show FETCH_HEAD:cnv.db > dati/cnv.db
            test -s dati/cnv.db
            echo "Database recuperato dal ramo dati"
          elif [ "$found" -eq 2 ]; then
            echo "Primo avvio: database nuovo"
          else
            echo "::error::Non riesco a controllare il ramo dati: aggiornamento annullato, il sito resta quello di ieri"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa CNV
        run: pip install -e ".[push]"

      - name: Sync (cinema, prossimamente, TMDB)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m app.sync

      - name: Prepara la notifica (film nuovi in sala)
        run: python -m app.push prepare --out "$RUNNER_TEMP/notifica.json" ${{ inputs.prova && '--prova' || '' }}

      # Prima della pubblicazione: gli id dei film nuovi finiscono sul sito, quindi devono
      # essere già salvati (altrimenti i voti del telefono andrebbero su altri film)
      - name: Salva il database nel ramo dati
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/salva-database.sh

      - name: Costruisci il sito (app per il browser e dati)
        run: python -m app.export_static --out site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Pubblica su GitHub Pages
        id: pubblica
        uses: actions/deploy-pages@v5

      # Dopo la pubblicazione, così toccando la notifica si aprono già i dati nuovi
      - name: Invia le notifiche all'app Android
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m app.push send "$RUNNER_TEMP/notifica.json"

      # I film notificati si segnano solo ora, a invio riuscito: se l'invio fallisce il passo
      # è rosso, qui non si arriva, e al prossimo giro gli stessi film vengono annunciati
      - name: Salva i film notificati nel ramo dati
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/salva-database.sh

      # In un repository pubblico GitHub mette in pausa gli orari programmati dopo 60 giorni
      # senza attività. Riattivare il workflow a ogni giro azzera il conto: non serve
      # nessun commit e, se non riesce, l'aggiornamento di oggi è comunque fatto.
      - name: Tieni attivo l'aggiornamento automatico
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/aggiorna-telefono.yml/enable"
          echo "Aggiornamento automatico attivo"
